name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pcapraven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned development toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          expected = tomllib.loads(
              Path("rust-toolchain.toml").read_text()
          )["toolchain"]["channel"]
          subprocess.run(
              [
                  "rustup",
                  "toolchain",
                  "install",
                  expected,
                  "--profile",
                  "minimal",
                  "--component",
                  "rustfmt",
                  "--component",
                  "clippy",
                  "--no-self-update",
              ],
              check=True,
          )
          PY

      - name: Verify pinned development toolchain and components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          expected = tomllib.loads(
              Path("rust-toolchain.toml").read_text()
          )["toolchain"]["channel"]
          rustc_version = subprocess.run(
              ["rustup", "run", expected, "rustc", "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.split()
          if (
              len(rustc_version) < 2
              or rustc_version[0] != "rustc"
              or rustc_version[1] != expected
          ):
              raise SystemExit(
                  f"expected rustc {expected}, got {' '.join(rustc_version)}"
              )
          installed = subprocess.run(
              ["rustup", "component", "list", "--installed", "--toolchain", expected],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          for component in ("rustfmt", "clippy"):
              if not any(line.startswith(f"{component}-") for line in installed):
                  raise SystemExit(
                      f"{component} is not installed for toolchain {expected}"
                  )
          rustfmt_version = subprocess.run(
              ["rustup", "run", expected, "rustfmt", "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          clippy_version = subprocess.run(
              ["rustup", "run", expected, "cargo", "clippy", "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if not rustfmt_version.startswith("rustfmt "):
              raise SystemExit(f"unexpected rustfmt version output: {rustfmt_version}")
          if not clippy_version.startswith("clippy "):
              raise SystemExit(f"unexpected clippy version output: {clippy_version}")
          print(
              f"verified rustc={' '.join(rustc_version)}; "
              f"rustfmt={rustfmt_version}; "
              f"clippy={clippy_version} via toolchain {expected}"
          )
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test bounded verification support
        run: python3 scripts/test_verification_support.py

      - name: Verify synthetic fixture integrity
        run: python3 scripts/generate_fixtures.py --check

      - name: Verify canonical CLI goldens
        run: python3 scripts/check_goldens.py

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Inspect Cargo metadata
        run: cargo metadata --format-version 1 --no-deps --locked

      - name: Check workspace architecture
        run: python3 scripts/check_workspace_architecture.py

      - name: Test Phase 18 benchmark methodology
        run: python3 scripts/test_phase18_performance.py

      - name: Test Phase 18.3 acceptance methodology
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_phase18_acceptance.py

      - name: Run Phase 18 benchmark smoke matrix
        run: |
          python3 scripts/run_phase18_benchmarks.py --smoke > /tmp/pcapraven-phase18-smoke.json
          python3 -m json.tool /tmp/pcapraven-phase18-smoke.json > /dev/null

  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Check workspace with MSRV
        run: cargo +1.85.0 check --workspace --all-targets --locked

      - name: Build workspace with MSRV
        run: cargo +1.85.0 build --workspace --locked

      - name: Test workspace with MSRV
        run: cargo +1.85.0 test --workspace --locked

  workspace-check:
    name: Cross-platform workspace check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Verify reporting schema contract
        run: cargo test -p pcapraven-reporting --test schema_contract --locked

      - name: Verify canonical CLI golden set
        run: cargo test -p pcapraven-cli --test golden --locked

      - name: Verify CLI v1 contract
        run: cargo test -p pcapraven-cli --test contract --locked

  fuzz-smoke:
    name: Linux fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_pcap_reader
            max_len: 4096
          - target: fuzz_packet_normalizer
            max_len: 8192
          - target: fuzz_flow_reconstructor
            max_len: 4096
          - target: fuzz_dns_parser
            max_len: 4096
          - target: fuzz_http_parser
            max_len: 8192
          - target: fuzz_tls_parser
            max_len: 32768
          - target: fuzz_detection_engine
            max_len: 4096
          - target: fuzz_reporting
            max_len: 8192
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        run: |
          FUZZ_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("fuzz/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded fuzz smoke campaign
        run: >-
          cargo fuzz run "${{ matrix.target }}"
          "corpus/${{ matrix.target }}" --
          -max_len=${{ matrix.max_len }}
          -max_total_time=30
          -timeout=5
          -rss_limit_mb=1024
        working-directory: fuzz

      - name: Upload target crash artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcapraven-fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7

  security-supply-chain:
    name: Security and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned development toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          expected = tomllib.loads(
              Path("rust-toolchain.toml").read_text()
          )["toolchain"]["channel"]
          subprocess.run(
              [
                  "rustup",
                  "toolchain",
                  "install",
                  expected,
                  "--profile",
                  "minimal",
                  "--no-self-update",
              ],
              check=True,
          )
          PY

      - name: Install cargo-audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          expected = tomllib.loads(
              Path("rust-toolchain.toml").read_text()
          )["toolchain"]["channel"]
          subprocess.run(
              [
                  "cargo",
                  f"+{expected}",
                  "install",
                  "cargo-audit",
                  "--version",
                  "0.22.2",
                  "--locked",
              ],
              check=True,
          )
          PY

      - name: Install cargo-deny
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          expected = tomllib.loads(
              Path("rust-toolchain.toml").read_text()
          )["toolchain"]["channel"]
          subprocess.run(
              [
                  "cargo",
                  f"+{expected}",
                  "install",
                  "cargo-deny",
                  "--version",
                  "0.20.2",
                  "--locked",
              ],
              check=True,
          )
          PY

      - name: Audit main lockfile with RustSec
        run: cargo audit --file Cargo.lock --deny warnings

      - name: Audit fuzz lockfile with RustSec
        run: cargo audit --file fuzz/Cargo.lock --deny warnings

      - name: Check main dependency policy
        run: cargo deny --all-features --config deny.toml --locked check advisories bans licenses sources

      - name: Check fuzz dependency policy
        run: cargo deny --manifest-path fuzz/Cargo.toml --all-features --config deny.toml --locked check advisories bans licenses sources
