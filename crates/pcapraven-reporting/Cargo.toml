[package]
name = "pcapraven-reporting"
description = "PcapRaven deterministic reporting library and serialization schemas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pcapraven-domain = { workspace = true }
serde = { version = "=1.0.219", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.140", default-features = false, features = ["alloc"] }
csv = { version = "=1.3.1", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
