[package]
name = "pcapraven-cli"
description = "PcapRaven command-line interface and analysis orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "pcapraven"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
pcapraven-domain = { workspace = true }
pcapraven-pcap = { workspace = true }
pcapraven-protocols = { workspace = true }
pcapraven-flows = { workspace = true }
pcapraven-detection = { workspace = true }
pcapraven-reporting = { workspace = true }
