[package]
name = "pcapraven-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "=0.4.13" }
pcapraven-domain = { path = "../crates/pcapraven-domain", version = "0.0.0" }
pcapraven-pcap = { path = "../crates/pcapraven-pcap", version = "0.0.0" }
pcapraven-protocols = { path = "../crates/pcapraven-protocols", version = "0.0.0" }
pcapraven-flows = { path = "../crates/pcapraven-flows", version = "0.0.0" }
pcapraven-detection = { path = "../crates/pcapraven-detection", version = "0.0.0" }
pcapraven-reporting = { path = "../crates/pcapraven-reporting", version = "0.0.0" }
serde_json = { version = "=1.0.143", default-features = false, features = ["alloc"] }
csv = { version = "=1.3.1", default-features = false }

[[bin]]
name = "fuzz_pcap_reader"
path = "fuzz_targets/fuzz_pcap_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_packet_normalizer"
path = "fuzz_targets/fuzz_packet_normalizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_flow_reconstructor"
path = "fuzz_targets/fuzz_flow_reconstructor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_parser"
path = "fuzz_targets/fuzz_dns_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_http_parser"
path = "fuzz_targets/fuzz_http_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tls_parser"
path = "fuzz_targets/fuzz_tls_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_detection_engine"
path = "fuzz_targets/fuzz_detection_engine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_reporting"
path = "fuzz_targets/fuzz_reporting.rs"
test = false
doc = false
bench = false
