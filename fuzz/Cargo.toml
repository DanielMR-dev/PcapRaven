[package]
name = "pcapraven-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "=0.4.13" }
pcapraven-domain = { path = "../crates/pcapraven-domain", version = "0.0.0" }
pcapraven-pcap = { path = "../crates/pcapraven-pcap", version = "0.0.0" }
pcapraven-protocols = { path = "../crates/pcapraven-protocols", version = "0.0.0" }
pcapraven-flows = { path = "../crates/pcapraven-flows", version = "0.0.0" }

[[bin]]
name = "fuzz_pcap_reader"
path = "fuzz_targets/fuzz_pcap_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_packet_normalizer"
path = "fuzz_targets/fuzz_packet_normalizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_flow_reconstructor"
path = "fuzz_targets/fuzz_flow_reconstructor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_parser"
path = "fuzz_targets/fuzz_dns_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_http_parser"
path = "fuzz_targets/fuzz_http_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tls_parser"
path = "fuzz_targets/fuzz_tls_parser.rs"
test = false
doc = false
bench = false

